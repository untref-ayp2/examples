version: "2"
linters:
  default: all
  disable:
    - cyclop
    - depguard
    - dupl
    - err113
    - errcheck
    - exhaustruct
    - forbidigo
    - funlen
    - gocognit
    - gocritic
    - godox
    - ireturn
    - lll
    - mnd
    - nlreturn
    - paralleltest
    - perfsprint
    - predeclared
    - revive
    - testpackage
    - varnamelen
    - whitespace
    - wsl
    - wrapcheck
